<?xml version="1.0" encoding="UTF-8"?>
<!--
  Das kleine Zeichen für die Kopfleiste: 34 × 24. In dieser Größe trägt
  nur noch die Silhouette, darum Becken und Welle und sonst nichts.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 24" width="34" height="24"
     role="img" aria-label="SwimPlan">
  <defs>
    <linearGradient id="spm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b6fd4"/>
      <stop offset="1" stop-color="#0a2e63"/>
    </linearGradient>
    <clipPath id="spmc">
      <rect x="1" y="2" width="32" height="20" rx="5"/>
    </clipPath>
  </defs>

  <rect x="1" y="2" width="32" height="20" rx="5" fill="url(#spm)"/>

  <g clip-path="url(#spmc)">
    <g stroke="#ffffff" stroke-opacity=".34" stroke-width="1"
       stroke-linecap="round" stroke-dasharray="2.5 2.5">
      <line x1="3" y1="8" x2="31" y2="8"/>
      <line x1="3" y1="16" x2="31" y2="16"/>
    </g>
    <path d="M3 12 q3.5 -3 7 0 t7 0 t7 0 t7 0"
          fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
